<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etkinlik Ekle — Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2416501008.css">
</head>
<body>

  <header>
    <h1>Etkinlik Ekle</h1>
  </header>

  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="etkinlikler.html">Etkinlikler</a>
    <a href="etkinlik-ekle.html">Ekle</a>
    <a href="etkinlik-guncelle.html">Güncelle</a>
  </nav>

  <main>
    <form action="etkinlik-ekle.html" method="post">
      <div class="form-grup">
        <label for="ad">Etkinlik adı</label>
        <input type="text" id="ad" name="ad" required>
      </div>

      <div class="form-grup">
        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori" required>
          <option value="">Seçiniz</option>
          <option value="seminer">Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="soylesi">Söyleşi</option>
        </select>
      </div>

      <div class="form-grup">
        <label for="tarih">Tarih</label>
        <input type="date" id="tarih" name="tarih" required>
      </div>

      <div class="form-grup">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="4"></textarea>
      </div>

      <button type="submit">Kaydet</button>
    </form>
  </main>

  <footer>
    <p>ALİ ÖZDAMAR &middot; 2416501008 &middot; 2026</p>
  </footer>

</body>
</html>
